name: Sync Roblox update log

on:
  release:
    types: [published, edited, unpublished, deleted]

  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate release notes/images without writing to Roblox
        type: boolean
        default: false

      allow_empty:
        description: Intentionally clear the log when no eligible releases remain
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: parkour-roblox-update-log
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sync reviewed notes and release image to Roblox
        env:
          GITHUB_TOKEN: ${{ github.token }}

          # Existing update-log DataStore credentials.
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}

          # New automatic image-upload credentials/configuration.
          ROBLOX_ASSET_API_KEY: ${{ secrets.ROBLOX_ASSET_API_KEY }}
          ROBLOX_ASSET_CREATOR_TYPE: ${{ vars.ROBLOX_ASSET_CREATOR_TYPE }}
          ROBLOX_ASSET_CREATOR_ID: ${{ vars.ROBLOX_ASSET_CREATOR_ID }}

          ROBLOX_DRY_RUN: ${{ inputs.dry_run || false }}
          ROBLOX_ALLOW_EMPTY: ${{ inputs.allow_empty || false }}
        run: python3 scripts/sync_roblox_update_log.py
