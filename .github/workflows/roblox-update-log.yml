name: Sync Roblox update log

on:
  release:
    types: [published, edited, released, unpublished, deleted]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate release notes without writing to Roblox
        type: boolean
        default: true
      allow_empty:
        description: Intentionally clear the log when no eligible releases remain
        type: boolean
        default: false

permissions:
  contents: read

# All writes from this repository are serialized. Every run rebuilds the
# CURRENT release list, so a pending run replaced by a newer run loses no notes.
concurrency:
  group: parkour-roblox-update-log
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync reviewed notes to Roblox
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_DRY_RUN: ${{ inputs.dry_run || false }}
          ROBLOX_ALLOW_EMPTY: ${{ inputs.allow_empty || false }}
        run: python3 scripts/sync_roblox_update_log.py
